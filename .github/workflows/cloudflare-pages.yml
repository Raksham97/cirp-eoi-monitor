name: Publish Neutral Cloudflare Site

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily CIRP EOI Monitor"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: neutral-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest fully audited site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Publish static site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy docs --project-name=brief-view-c5b417 --branch=main

      - name: Verify neutral production URL received this exact dataset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(python -c "import json; print(json.load(open('docs/data.json'))['meta']['generated_at'])")"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS -H 'Cache-Control: no-cache' "https://brief-view-c5b417.pages.dev/data.json?verify=${GITHUB_RUN_ID}-${i}" -o /tmp/live.json; then
              LIVE="$(python -c "import json; print(json.load(open('/tmp/live.json'))['meta']['generated_at'])")"
              if [ "$LIVE" = "$EXPECTED" ]; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "Cloudflare verification failed: expected generated_at=$EXPECTED"; exit 1; }
          curl -fsS "https://brief-view-c5b417.pages.dev/cirp-eoi-monitor.xlsx?verify=${GITHUB_RUN_ID}" -o /tmp/live.xlsx
          [ "$(wc -c < /tmp/live.xlsx)" -gt 5000 ] || { echo 'Cloudflare Excel verification failed'; exit 1; }
          echo "Cloudflare production verified at generated_at=$EXPECTED"
