name: Daily CIRP EOI Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2,12 * * *' # approx 08:00 and 18:00 IST

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cirp-eoi-daily
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run reliability tests
        run: python -m pytest -q

      - name: Restore durable state
        run: python scripts/state.py restore

      - name: Independent IBBI source canary
        run: python scripts/ibbi_canary.py

      - name: Ingest complete IBBI Form G listing
        env:
          DATABASE_URL: sqlite+pysqlite:///./cirp_eoi.sqlite3
          APP_PASSWORD: ''
          FETCH_PDFS: 'false'
          REQUEST_TIMEOUT_SECONDS: '25'
        run: >-
          python -m app.cli ingest
          --pages 400
          --store-days-back 120

      - name: Audit complete-source and working-window coverage
        env:
          DATABASE_URL: sqlite+pysqlite:///./cirp_eoi.sqlite3
        run: python scripts/audit_working_window.py

      - name: Build Excel
        env:
          DATABASE_URL: sqlite+pysqlite:///./cirp_eoi.sqlite3
        run: python -m app.cli export --output docs/cirp-eoi-monitor.xlsx

      - name: Build static dashboard
        env:
          DATABASE_URL: sqlite+pysqlite:///./cirp_eoi.sqlite3
        run: python -m app.static_site --output docs

      - name: Persist database as text state
        run: python scripts/state.py dump

      - name: Record heartbeat
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > data/last_successful_run.txt

      - name: Commit only fully audited state and generated files
        run: |
          git config user.name 'cirp-eoi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "data: verified full-source CIRP refresh $(date -u +%F-%H%MZ)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
